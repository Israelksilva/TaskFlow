# Ambiente local completo: PostgreSQL + API (o front roda com `npm run dev:web`).
# Uso: docker compose up --build   →   API em http://localhost:3333
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: andamo
      POSTGRES_PASSWORD: andamo-local
      POSTGRES_DB: andamo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andamo"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["3333:3333"]
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://andamo:andamo-local@db:5432/andamo
      # Somente para uso local. Em produção, gere um segredo forte.
      JWT_SECRET: local-docker-secret-change-me-0123456789abcdef
      CORS_ORIGIN: http://localhost:8080
      APP_URL: http://localhost:8080
      LOG_LEVEL: info

volumes:
  pgdata:
