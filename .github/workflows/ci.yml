name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Testes da API usam PostgreSQL embutido (PGlite): não precisam de banco externo.
      - run: npm test
      - run: npm run build
      # Sobe o bundle de produção da API e confere o health check
      # (pega erros de importação/ESM que os testes não exercitam).
      - name: Smoke test do bundle da API
        working-directory: apps/api
        env:
          NODE_ENV: development
          PORT: 3399
          DATABASE_URL: pglite://memory
          JWT_SECRET: ci-smoke-secret-ci-smoke-secret-0123
          WORKER_ENABLED: "false"
          LOG_LEVEL: warn
        run: |
          node dist/server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3399/health && exit 0; sleep 1; done
          echo "API não respondeu ao health check" && exit 1

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Banco em memória (PGlite); nenhum segredo real é usado.
      - run: npm run e2e
        env:
          E2E_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker da API
        run: docker build -t andamo-api:ci .
