# Blueprint do Render para a API (publicação em etapa futura).
# Render → New → Blueprint → selecione este repositório.
services:
  - type: web
    name: andamo-api
    runtime: node
    rootDir: .
    plan: free
    # --include=dev: as ferramentas de build (tsup) são devDependencies.
    buildCommand: npm ci --include=dev && npm run build -w @andamo/api
    # Aplica migrações pendentes e inicia o servidor (o Render define PORT).
    startCommand: npm run db:migrate:prod -w @andamo/api && npm run start -w @andamo/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # cole a connection string do Neon no painel
      - key: JWT_SECRET
        generateValue: true
      # Access token curto; a sessão continua pelo refresh token rotativo.
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: CORS_ORIGIN
        sync: false # ex.: https://seu-usuario.github.io
      - key: APP_URL
        sync: false # ex.: https://seu-usuario.github.io/TaskFlow (links de e-mail/push)
      - key: LOG_LEVEL
        value: info
      # Integrações opcionais — ficam desligadas (sem fingir funcionar) até serem preenchidas.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CONTACT_EMAIL
        sync: false
