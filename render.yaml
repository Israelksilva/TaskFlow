# Blueprint do Render para a API (publicação em etapa futura).
# Render → New → Blueprint → selecione este repositório.
services:
  - type: web
    name: andamo-api
    runtime: node
    rootDir: .
    plan: free
    # --include=dev: as ferramentas de build (tsup) são devDependencies.
    buildCommand: npm ci --include=dev && npm run build -w @andamo/api
    # Aplica migrações pendentes e inicia o servidor (o Render define PORT).
    startCommand: npm run db:migrate:prod -w @andamo/api && npm run start -w @andamo/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # cole a connection string do Neon no painel
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MIN
        value: "15"
      - key: DATA_ENCRYPTION_KEY
        sync: false # 64 caracteres hex; cifra os segredos de 2FA
      - key: APP_URL
        sync: false # ex.: https://seu-usuario.github.io/TaskFlow/ (links dos e-mails)
      - key: API_PUBLIC_URL
        sync: false # ex.: https://andamo-api.onrender.com (retorno do Google)
      - key: RESEND_API_KEY
        sync: false # opcional: sem ela, nenhum e-mail é enviado
      - key: MAIL_FROM
        sync: false # ex.: Andamo <nao-responda@seu-dominio.com>
      - key: GOOGLE_CLIENT_ID
        sync: false # opcional: sem ela, o login com Google fica oculto
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false # ex.: https://seu-usuario.github.io
      - key: LOG_LEVEL
        value: info
